name: Release downloads

# Publishes a GitHub Release with ready-to-open builds. Either push a tag like v0.2.0,
# or run it manually from the Actions tab and enter the tag (it is created on the chosen branch).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run build:portable
      - name: Package downloads
        run: |
          cp dist-portable/index.html poland-ww2-map.html
          cp -r dist poland-ww2-map-site
          cp scripts/serve/start.sh scripts/serve/start.bat scripts/serve/README.txt poland-ww2-map-site/
          chmod +x poland-ww2-map-site/start.sh
          zip -r poland-ww2-map-site.zip poland-ww2-map-site
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" poland-ww2-map.html poland-ww2-map-site.zip \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file .github/release-notes.md --prerelease
